    if(ip>=0&&!fixed(ip)&&pg(ip,'pro')>0) g[ip]=Math.max(30,Math.min(300,(t.pro-sum('pro',[ip]))/pg(ip,'pro')));
    const R=t.kcal-sum('kcal',[ic,iF]);
    if(iF>=0&&!fixed(iF)) g[iF]=Math.min(fMax,Math.max(0,(t.fat-sum('fat',[iF]))/pg(iF,'fat')));
    if(ic>=0&&!fixed(ic)) g[ic]=Math.max(0,(R-(iF>=0?g[iF]*pg(iF,'kcal'):0))/pg(ic,'kcal'));
    if(ic>=0&&!fixed(ic)&&g[ic]>cMax&&iF>=0&&!fixed(iF)){ const extra=(g[ic]-cMax)*pg(ic,'kcal'); g[ic]=cMax; g[iF]=Math.min(fMax,g[iF]+extra/pg(iF,'kcal')); }
    if(iF>=0&&!fixed(iF)&&(ic<0||fixed(ic))) g[iF]=Math.min(fMax,Math.max(0,(R-(ic>=0?g[ic]*pg(ic,'kcal'):0))/pg(iF,'kcal')));
    if(ic>=0&&!fixed(ic)){ const left=R-(iF>=0?g[iF]*pg(iF,'kcal'):0)-g[ic]*pg(ic,'kcal'); if(left>0) g[ic]+=left/pg(ic,'kcal'); }
  }

  if(tot>cap&&iv>=0&&!fixed(iv)){ const cut=Math.min(tot-cap,g[iv]-30); if(cut>0){ g[iv]-=cut; tot-=cut; } }
  if(tot>cap&&ic>=0&&!fixed(ic)){ const cut=Math.min(tot-cap,g[ic]); const lost=cut*pg(ic,'kcal'); g[ic]-=cut; tot-=cut;
    if(iF>=0&&!fixed(iF)&&pg(iF,'kcal')>=4) g[iF]+=lost/pg(iF,'kcal'); } // only energy-dense fats (oil, nuts) make up the trimmed kcal

}
const curWk=()=>Math.max(1,progWeekRaw());

function genWeek(wk,opt={}){
  const old=S.meal.weeks[wk], src=opt.from?S.meal.weeks[opt.from]:null;
  const seed=opt.seed ?? (old?old.seed+1:wk*7919+13), R=rng(seed), cap=+S.meal.set.cap||350;
  const P={}; for(const r of ['p','v','c','f','k']) P[r]=pool(r).list;
  const avoidPrev=new Set(opt.fresh&&src?src.days.flat().flatMap(m=>m.items.map(x=>x.id)):[]);
  const use={}, W={seed, at:today(), days:[]};
  for(let d=0;d<7;d++){
    const mt=mealTargets(d<5), used=new Set(), row=[];
    for(let s=0;s<5;s++){
      const keep=old&&!opt.fresh&&!opt.from&&old.days[d]?.[s]?.lock;
      let items;
      if(keep){ row.push(old.days[d][s]); old.days[d][s].items.forEach(x=>{ used.add(x.id); use[x.id]=(use[x.id]||0)+1; }); continue; }
      if(opt.keepFoods&&src?.days[d]?.[s]) items=src.days[d][s].items.map(x=>({id:x.id,r:x.r}));
      else items=ROLES(s).map(r=>{ const L=P[r]; if(!L.length) return null;
        const prevId=d>0?W.days[d-1][s]?.items.find(x=>x.r===r)?.id:null; let best=null,bs=1e9;
        for(const f of L){ const sc=(use[f.id]||0)*3+(prefers(r,s,f)?0:4)+(used.has(f.id)?(L.length>=5?100:8):0)+(f.id===prevId?6:0)+(avoidPrev.has(f.id)?5:0)+R()*2; if(sc<bs){bs=sc;best=f;} }
        return {id:best.id,r}; }).filter(Boolean);
      let sol=solveMeal(items,mt[s],cap);
      if(!opt.keepFoods) sol=repairMeal(sol,mt[s],cap,P,used);
      sol.forEach(x=>{ used.add(x.id); use[x.id]=(use[x.id]||0)+1; });

function mealErr(items,t){ const n=mealNut({items}); return Math.abs(n.kcal-t.kcal)/t.kcal+Math.abs(n.pro-t.pro)/t.pro; }

  for(const r of ['f','c']){
    const L=[...(P[r]||[])].filter(f=>!used.has(f.id)).sort((a,b)=>b.kcal-a.kcal).slice(0,4);
    for(const f of L){ const base=best.some(x=>x.r===r)?best.map(x=>x.r===r?{id:f.id,r}:{id:x.id,r:x.r}):[...best.map(x=>({id:x.id,r:x.r})),{id:f.id,r}];
      const c=solveMeal(base,t,cap), e=mealErr(c,t); if(e<be-0.01){ best=c; be=e; } }
    if(be<=0.1) break;
  }
  return best;
}
function copyWeek(from,to){ const w=S.meal.weeks[from]; if(!w) return false; S.meal.weeks[to]=JSON.parse(JSON.stringify({...w,at:today()})); S.meal.weeks[to].days.forEach(r=>r.forEach(m=>m.lock=false)); return true; }
function resolveMeal(wk,d,s){ const m=S.meal.weeks[wk].days[d][s]; m.items=solveMeal(m.items.map(x=>({id:x.id,r:x.r})),mealTargets(d<5)[s],+S.meal.set.cap||350); }
function swapItem(wk,d,s,i){
  const m=S.meal.weeks[wk].days[d][s], it=m.items[i], cur=food(it.id), L=pool(it.r).list;
  let cand=L.filter(f=>f.g===cur?.g); if(cand.length<2) cand=L; if(!cand.length) return null;
  cand=[...cand].sort((a,b)=>a.name<b.name?-1:1); const j=cand.findIndex(f=>f.id===it.id);
  it.id=cand[(j+1)%cand.length].id; resolveMeal(wk,d,s); return food(it.id);
}

/* ---- nutrition ---- */
function mealNut(m){
  const o={g:0,addNR:false}; NUTS.forEach(([k])=>o[k]=0);
  for(const it of m.items){ const f=food(it.id); if(!f) continue; const q=it.g/100; o.g+=it.g;
    for(const [k] of NUTS){ if(k==='add'){ if(f.add==null){ if(it.g>0) o.addNR=true; } else o.add+=f.add*q; } else o[k]+=(f[k]||0)*q; } }
  return o;
}
function dayNut(row){ const o={g:0,addNR:false}; NUTS.forEach(([k])=>o[k]=0); for(const m of row){ const n=mealNut(m); for(const k in o){ if(k==='addNR') o.addNR||=n.addNR; else o[k]+=n[k]; } } return o; }
const fmtNut=(k,v)=>k==='kcal'||k==='na'||k==='k'||k==='chol'?fmtN(Math.round(v)):String(Math.round(v*10)/10);
function adherence(k,vals,refs){
  const kind=NUT_KIND[k]; if(!kind) return null; let ok=0;
  vals.forEach((v,i)=>{ const t=refs[i][k]; if(kind==='r'?Math.abs(v-t)<=0.1*t:kind==='n'?v>=0.9*t:v<=t) ok++; });
  return Math.round(ok/vals.length*100);
}
function weekTable(wk){
  const W=S.meal.weeks[wk]; if(!W) return null;
  const dn=W.days.map(dayNut), refs=W.days.map((_,d)=>dayRefs(d<5));
  return NUTS.map(([k,l,u])=>{ const vals=dn.map(x=>x[k]), avg=vals.reduce((a,b)=>a+b,0)/7, tgt=NUT_KIND[k]?refs.reduce((a,r)=>a+r[k],0)/7:null;
    return {k,l,u,vals,avg,tgt,adh:adherence(k,vals,refs),nr:k==='add'&&dn.some(x=>x.addNR)}; });
}
const csvCell=v=>{ const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
function weekCSV(wk){
  const T=weekTable(wk), W=S.meal.weeks[wk]; if(!T) return '';
  const L=[['Week '+wk+' nutrition',...WDAYS.map((d,i)=>d+' '+wkDate(wk,i)),'Average','Target','Adherence %']];
  T.forEach(r=>L.push([r.l+(r.u?' ('+r.u+')':'')+(r.nr?' *partial':''),...r.vals.map(v=>fmtNut(r.k,v).replace(/,/g,'')),fmtNut(r.k,r.avg).replace(/,/g,''),r.tgt==null?'':Math.round(r.tgt),r.adh==null?'':r.adh]));
  L.push([]); L.push(['Day','Date','Meal','Food','Grams','Calories','Protein g','Carbs g','Fat g','Fiber g','Sodium mg','FDC id']);
  W.days.forEach((row,d)=>row.forEach((m,s)=>m.items.forEach(it=>{ const f=food(it.id); if(!f) return; const q=it.g/100;
    L.push([WDAYS[d],wkDate(wk,d),SLOTS[s],f.name,it.g,Math.round(f.kcal*q),r1(f.pro*q),r1(f.carb*q),r1(f.fat*q),r1(f.fib*q),Math.round(f.na*q),f.fdc||'custom']); })));
  L.push([]); L.push(['* Added sugars: USDA SR Legacy does not report added sugar; whole foods count as 0, other foods are not reported.']);
  return L.map(r=>r.map(csvCell).join(',')).join('\n');
}

  return c&&c.u ? {u:c.u+encodeURIComponent(q), l:c.l} : {u:gShop(q+(st?.addr?' near '+st.addr.replace(/.*\b(\d{5})\b.*/,'$1'):'')), l:'Google Shopping'};

function itemPrice(f,st){ // user price first; otherwise the checked Walmart.com price only when shopping at a Walmart
  const e=S.meal.edits[f.id];
  if(e&&e.pr!=null&&e.pr!=='') return {p:+e.pr, src:'your price'+(e.prd?' · '+fmtDate(e.prd):''), mine:true};

function shopList(wk){
  const W=S.meal.weeks[wk]; if(!W) return null; const agg={};
  W.days.forEach(row=>row.forEach(m=>m.items.forEach(it=>{ if(it.g>0) agg[it.id]=(agg[it.id]||0)+it.g; })));
  const sh=S.meal.shop[wk]||{}, out=[];
  for(const [id,g] of Object.entries(agg)){ const f=food(id); if(!f) continue;
    const buy=g/(+f.yld||1), pk=f.pg>0?Math.max(1,Math.ceil(buy/f.pg-1e-9)):1, sid=S.meal.assign[id]&&storeById(S.meal.assign[id])?S.meal.assign[id]:S.meal.primary, st=storeById(sid)||null, pr=itemPrice(f,st);
    out.push({id,f,g:Math.round(g),buy:Math.round(buy),pk,sid:st?st.id:null,st,sec:SECTIONS[f.sec]?f.sec:'Y',price:pr,est:pr?pr.p*pk:null,got:!!sh.got?.[id],have:!!sh.have?.[id]}); }
  return out;
}
function groupedShop(wk){
  const L=shopList(wk); if(!L) return null;
  const order=[...S.meal.stores.map(s=>s.id),null], G=[];
  for(const sid of order){ const items=L.filter(x=>x.sid===sid); if(!items.length) continue;
    const secs=Object.keys(SECTIONS).map(k=>({k,l:SECTIONS[k],items:items.filter(x=>x.sec===k).sort((a,b)=>a.f.name<b.f.name?-1:1)})).filter(x=>x.items.length);
    const need=items.filter(x=>!x.have), priced=need.filter(x=>x.est!=null);
    G.push({sid, st:storeById(sid)||null, secs, n:items.length, total:priced.reduce((a,x)=>a+x.est,0), unpriced:need.length-priced.length}); }
  return G;
}

    out.push(`<li><b>${esc(f.name)} · ${it.g} g</b> — ${esc(meth)}${time&&time!=='—'?' · '+esc(time):''}${temp&&temp!=='—'?' · '+esc(temp):''}. ${esc(how)}</li>`); });
  return `<ol class="prep">${out.join('')}</ol><ul class="tips">${SLEEVE_TIPS.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
}

function download(name,text,type){ const u=URL.createObjectURL(new Blob([text],{type})); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
function logMeal(wk,d,s){
  const key=`${wk}|${d}|${s}`; if(S.meal.logged[key]) return false;
  const n=mealNut(S.meal.weeks[wk].days[d][s]), v={calories:Math.round(n.kcal),protein:Math.round(n.pro),carbs:Math.round(n.carb),fat:Math.round(n.fat),fiber:Math.round(n.fib),sodium:Math.round(n.na)}, dd=day();
  for(const [m,x] of Object.entries(v)){ dd.hist.push({m,prev:dd[m]||0,meal:key}); dd[m]=(dd[m]||0)+x; }
  S.meal.logged[key]={on:today(),v}; save(); return v;
}
function unlogMeal(key){
  const lg=S.meal.logged[key]; if(!lg) return false; const dd=S.days[lg.on];
  if(dd){ for(const [m,x] of Object.entries(lg.v)) dd[m]=Math.max(0,(dd[m]||0)-x); dd.hist=(dd.hist||[]).filter(h=>h.meal!==key); }
  delete S.meal.logged[key]; save(); return true;
}

function applySwap(orig,date,alt,always){
  const day=S.swaps.day;
  if(always){
    if(alt===orig) delete S.swaps.always[orig]; else S.swaps.always[orig]=alt;
    if(day[date]){ delete day[date][orig]; if(!Object.keys(day[date]).length) delete day[date]; }
  } else {
    const base=S.swaps.always[orig]||orig;
    if(alt===base){ if(day[date]){ delete day[date][orig]; if(!Object.keys(day[date]).length) delete day[date]; } }
    else (day[date] ||= {})[orig]=alt;
  }
  save();
}
function undoSwap(orig,date,kind){
  if(kind==='always') delete S.swaps.always[orig];
  else if(S.swaps.day[date]){ delete S.swaps.day[date][orig]; if(!Object.keys(S.swaps.day[date]).length) delete S.swaps.day[date]; }
  save();
}

function logMetric(m, amount, mode='add'){

      S.checkins=S.checkins.filter(x=>x.date!==date); S.checkins.push(c); save(); renderProgress(); toast('Check-in saved ✓');
      if(!c.photos) setTimeout(()=>toast('📸 Don\'t forget progress photos!'),1900); break; }
    case 'del-checkin': if(confirm('Delete this check-in?')){ S.checkins=S.checkins.filter(x=>x.date!==el.dataset.date); save(); renderProgress(); } break;
    case 'fx': { const none=el.dataset.v==='None';
      document.querySelectorAll('#zFx .chip').forEach(c=>{ if(c===el) c.classList.toggle('on'); else if(none || c.dataset.v==='None') c.classList.remove('on'); }); break; }
    case 'add-zep': { const date=$('#zDate').value; if(!date){ toast('Pick a date'); break; }
      const effects=[...document.querySelectorAll('#zFx .chip.on')].map(c=>c.dataset.v);
      S.zep.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date,dose:+$('#zDose').value,site:$('#zSite').value,effects,notes:$('#zNotes').value.trim()});
      save(); renderZep(); toast('Injection logged ✓'); break; }
    case 'del-zep': if(confirm('Delete this injection entry?')){ S.zep=S.zep.filter(z=>z.id!==el.dataset.id); save(); renderZep(); } break;
    case 'mealf': mealFilter=el.dataset.v; renderMeals(); break;
    case 'log-meal': { const m=(el.dataset.kind==='s'?SWEETS:MEALS)[+el.dataset.i]; const d=day();
      d.hist.push({m:'protein',prev:d.protein||0}); d.protein=(d.protein||0)+m.p;
      d.hist.push({m:'calories',prev:d.calories||0}); d.calories=(d.calories||0)+m.c; save();
      toast(`+${m.p} g protein · +${m.c} cal`); break; }
    case 'settings': openSettings(); break;
    case 'send-coach': sendToCoach(); break;
    case 'coach-copy': copyText(coachText).then(ok=>toast(ok?'Copied. Paste it in your coach chat.':'Copy failed: select the text manually')); break;
    case 'coach-share': navigator.share({title:'Weekly summary', text:coachText}).catch(err=>{ if(err && err.name!=='AbortError') toast('Share not available: use Copy'); }); break;
    case 'export': { const blob=new Blob([exportJSON()],{type:'application/json'}); const u=URL.createObjectURL(blob);
      const lnk=document.createElement('a'); lnk.href=u; lnk.download=`suprahuman-backup-${today()}.json`; document.body.appendChild(lnk); lnk.click(); lnk.remove();
      setTimeout(()=>URL.revokeObjectURL(u),2000); toast('Backup downloaded ✓'); break; }
    case 'copy-json': if(navigator.clipboard) navigator.clipboard.writeText(exportJSON()).then(()=>toast('Copied ✓'),()=>toast('Copy failed')); else toast('Clipboard not available'); break;
    case 'import': $('#importFile').click(); break;
    case 'save-settings': { const g=id=>num($('#'+id).value);
      const v={start:g('sStart'),goal:g('sGoal'),calMin:g('sCalMin'),calMax:g('sCalMax'),proMin:g('sProMin'),proMax:g('sProMax'),water:g('sWater'),steps:g('sSteps')};
      if(Object.values(v).some(x=>x===null||x<=0)){ toast('Check all fields'); break; }
      if(v.goal>=v.start||v.calMin>v.calMax||v.proMin>v.proMax){ toast('Min must be ≤ max, goal < start'); break; }
      Object.assign(S.profile,{start:v.start,goal:v.goal});
      Object.assign(S.targets,{calMin:v.calMin,calMax:v.calMax,proMin:v.proMin,proMax:v.proMax,water:v.water,steps:v.steps});
      save(); closeSheet(); show(tab); toast('Targets saved ✓'); break; }
    case 'reset': if(confirm('Erase ALL data on this device? Export a backup first!') && confirm('Really erase everything?')){ S=DEFAULTS(); save(); closeSheet(); show('today'); toast('All data erased'); } break;
  }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(mealInput(el)) return;
  if(el.dataset.action==='ex-weight'){ const row=el.closest('.ex'), name=row.dataset.ex, n=+row.dataset.n, d=day();
    const st=d.ex[name] ||= {sets:Array(n).fill(false),w:''}; st.w=el.value.trim().slice(0,12); save(); }
  if(el.dataset.pw){ const n=$(`[data-pwn="${el.dataset.pw}"]`); if(n) n.value=el.value; updatePW(); }
  if(el.dataset.pwn){ const r=$(`[data-pw="${el.dataset.pwn}"]`), v=Number(el.value); if(r && Number.isFinite(v)) r.value=Math.max(0,Math.min(100,v)); updatePW(); }
  if(el.id==='planWeekSel'){ planWeek=+el.value; renderPlan(); }
  if(el.type==='range' && el.dataset.out) $('#'+el.dataset.out).textContent=el.value;
});
document.addEventListener('change', e=>{ mealChange(e.target); });
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='logAmt'){ const b=document.querySelector('[data-action="log-add"]'); if(b) b.click(); }
  if(e.key==='Enter' && e.target.id==='wLb'){ document.querySelector('[data-action="add-weight"]').click(); }
  if(e.key==='Escape') closeSheet();
});
$('#importFile').addEventListener('change', async e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  try{ const text=await file.text(); JSON.parse(text);
    if(!confirm('Replace all current data with this backup?')) return;
    importData(text); closeSheet(); show(tab); toast('Backup restored ✓');
  }catch(err){ alert('Import failed: '+err.message); }
});
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(tab==='progress') drawChart(); },150); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && tab==='today'){ selDow=null; renderToday(); } });

load();
show(views.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'today');
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supra Human">
<title>My Supra Human</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M36 6L14 36h14l-4 22 26-32H36z' fill='%23d4ff3a'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0d10'/%3E%3Cpath d='M36 6L14 36h14l-4 22 26-32H36z' fill='%23d4ff3a'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0d10; --bg2:#11151b; --card:#161b22; --card2:#1d232c; --line:#2a313c;
  --text:#f3f5f7; --muted:#8b95a3; --dim:#5d6673;
  --accent:#d4ff3a; --accent-ink:#0b0d10;
  --pro:#d4ff3a; --cal:#ff8a3d; --water:#3dc8ff; --steps:#b48cff;
  --good:#3ddc84; --warn:#ffb13d; --bad:#ff5a5f;
  --r:18px; --nav:72px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 16px calc(var(--nav) + var(--safe-b) + 24px)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 14px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,rgba(11,13,16,0))}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 24px rgba(212,255,58,.25)}
.logo svg{width:20px;height:20px}
.brand h1{font-size:18px;margin:0;letter-spacing:-.2px;font-weight:800}
.brand h1 span{color:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.icon-btn svg{width:22px;height:22px;stroke:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 4px;font-weight:750;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.section-title{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;font-weight:700}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(212,255,58,.18),transparent 55%),var(--card)}
.hero .big{font-size:40px;font-weight:850;letter-spacing:-1.5px;line-height:1}
.hero .big small{font-size:16px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:4px}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--muted);font-size:12px;font-weight:650;border:1px solid var(--line)}
.pill.accent{background:rgba(212,255,58,.12);color:var(--accent);border-color:rgba(212,255,58,.3)}
.pill.warn{background:rgba(255,177,61,.12);color:var(--warn);border-color:rgba(255,177,61,.3)}
.pill.bad{background:rgba(255,90,95,.12);color:var(--bad);border-color:rgba(255,90,95,.3)}
.pill.good{background:rgba(61,220,132,.12);color:var(--good);border-color:rgba(61,220,132,.3)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:188px;transition:transform .12s}
.ring-card:active{transform:scale(.97)}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .val b{font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1}
.ring .val span{font-size:11px;color:var(--muted);margin-top:3px}
.ring-card .lbl{font-weight:700;font-size:14px}
.ring-card .tgt{font-size:12px;color:var(--muted)}
.ring-card .add{margin-top:auto;width:100%;height:36px;line-height:34px;border-radius:12px;background:var(--card2);font-weight:700;font-size:13px;border:1px solid var(--line)}
.btn{height:48px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(255,90,95,.14);color:var(--bad);border:1px solid rgba(255,90,95,.3)}
.btn.sm{height:38px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:48px;height:40px;padding:0 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.today:not(.on){color:var(--text);border-color:rgba(212,255,58,.5)}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:650;margin:10px 0 6px}
.inp,select.inp,textarea.inp{width:100%;height:48px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);padding:0 14px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--accent)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.ex{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.ex:first-of-type{border-top:0}
.check{flex:0 0 auto;width:34px;height:34px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px;transition:.15s}
.check svg{width:18px;height:18px;stroke:var(--accent-ink);stroke-width:3.2;opacity:0}
.ex.done .check{background:var(--accent);border-color:var(--accent)}
.ex.done .check svg{opacity:1}
.ex .name{font-weight:700;font-size:15px}
.ex.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.ex .scheme{color:var(--accent);font-weight:700;font-size:13px}
.ex .last{color:var(--muted);font-size:12px}
.sets{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.set{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:750;color:var(--muted)}
.set.on{background:rgba(212,255,58,.16);border-color:var(--accent);color:var(--accent)}
.wt{width:92px;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.wt input{width:92px;height:42px;text-align:center;padding:0 6px}
.wt small{font-size:11px;color:var(--dim)}
.note{background:var(--bg2);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted)}
.note b{color:var(--text)}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin:3px 0}
details.card summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:750;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:22px;color:var(--muted);font-weight:400}
details.card[open] summary::after{content:"–"}
.plan-day .ex{padding:9px 0}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;margin-bottom:14px;background:rgba(212,255,58,.1);border:1px solid rgba(212,255,58,.3);font-size:14px}
.banner.warn{background:rgba(255,177,61,.1);border-color:rgba(255,177,61,.35)}
.banner .emoji{font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
.stat span{font-size:11px;color:var(--muted)}
canvas#chart{width:100%;height:240px;display:block;margin-top:10px}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.del{width:36px;height:36px;border-radius:10px;color:var(--dim);font-size:20px;flex:0 0 auto}
.del:active{color:var(--bad)}
.meal{padding:14px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .t{font-weight:750}
.meal .d{color:var(--muted);font-size:13px;margin:3px 0 8px}
.macro{font-size:12px;font-weight:700;color:var(--muted)}
.macro b{color:var(--pro)}
.macro i{font-style:normal;color:var(--cal)}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:14px 0}
.big-date{font-size:30px;font-weight:850;letter-spacing:-1px}
footer.disc{margin:26px 4px 0;font-size:11.5px;color:var(--dim);line-height:1.5;text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,21,27,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--dim)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .ic{background:rgba(212,255,58,.12)}
nav.tabs .ic{width:52px;height:30px;border-radius:99px;display:grid;place-items:center}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.sheet .in{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + var(--safe-b))}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 14px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.view{display:none;animation:fade .2s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
a.btn{text-decoration:none}
.howto-btn{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:11px;background:rgba(212,255,58,.1);border:1px solid rgba(212,255,58,.3);color:var(--accent);font-weight:750;font-size:13px;white-space:nowrap}
.howto-btn::after{content:"";position:absolute;inset:-5px -4px}
.howto-btn svg{width:12px;height:12px;fill:currentColor}
.howto-btn:active{filter:brightness(.85)}
.ex-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:4px}
.plan-day .ex{align-items:center}
.kicker{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
.video{position:relative;width:100%;aspect-ratio:16/9;margin-top:14px;border-radius:14px;overflow:hidden;background:#000 center/cover no-repeat;border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid-src{margin-top:8px;font-size:12px;color:var(--muted)}
.vid-src b{color:var(--text);font-weight:650}
.alt-link{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:8px;padding:10px 14px;border-radius:13px;background:var(--bg2);border:1px dashed var(--line);color:var(--muted);font-size:13px;text-decoration:none}
.alt-link b{color:var(--text)}
.cues{list-style:none;margin:14px 0 0;padding:0}
.cues li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.cues li:first-child{border-top:0}
.cues .k{flex:0 0 58px;padding-top:2px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
.cues li.avoid .k{color:var(--bad)}
.hidden{display:none!important}
.ex-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#workoutCard .ex{flex-wrap:wrap}
.row-actions{flex-basis:100%;margin:-4px 0 0 46px}
.prog-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:14px;padding:10px 14px;min-height:52px;border-radius:14px;background:rgba(212,255,58,.08);border:1px solid rgba(212,255,58,.28);text-align:left;font-size:14px}
.prog-chip b{color:var(--accent);font-weight:800}
.prog-chip .sub{font-size:12px}
.prog-chip>span:last-child{font-size:22px;color:var(--accent)}
select#planWeekSel{font-size:15px;padding-right:34px}
.repl-btn{background:var(--card2);border-color:var(--line);color:var(--text)}
.repl-btn svg{width:14px;height:14px;fill:none}
.ss{display:inline-block;vertical-align:1px;margin-right:6px;padding:1px 6px;border-radius:6px;background:rgba(212,255,58,.14);color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.3px}
.ss.fin{background:rgba(255,177,61,.14);color:var(--warn)}
.swapped{margin-top:3px;font-size:12px;color:var(--warn);display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px}
.linkbtn{min-height:32px;padding:0 6px;color:var(--accent);font-weight:750;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.prog-hdr{background:radial-gradient(120% 140% at 100% 0%,rgba(212,255,58,.14),transparent 60%),var(--bg2);border:1px solid rgba(212,255,58,.25);border-radius:14px;padding:12px 14px}
.prog-hdr.deload{border-color:rgba(255,177,61,.35);background:var(--bg2)}
.prog-wk{font-size:17px;font-weight:850;letter-spacing:-.2px}
.prog-bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.prog-bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tl{display:flex;gap:3px;margin-top:14px;height:22px}
.tl-seg{min-width:6px;border-radius:5px;background:rgba(212,255,58,.28);border:1px solid transparent;padding:0}
.tl-seg.dl{background:var(--card2);border-color:var(--line)}
.tl-seg.on{background:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.tl-seg.dl.on{background:var(--warn);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--warn)}
.week-nav{display:flex;gap:8px;align-items:center;margin-top:12px}
.week-nav select{flex:1;min-width:0}
.nav-btn{flex:0 0 auto;width:48px;height:48px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-size:24px;font-weight:700;line-height:1}
.nav-btn:disabled{opacity:.35}
.phase-card.deload{border-color:rgba(255,177,61,.35)}
.ph-grid{display:grid;gap:8px;margin-top:12px}
.ph-grid>div{display:flex;flex-direction:column;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.ph-grid span{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.ph-grid b{font-size:14px;font-weight:650}
.ph-notes{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.ph-notes li{margin:4px 0}
.alt-list{margin-top:12px;border-top:1px solid var(--line)}
.alt-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.alt-pick{flex:1;min-width:0;min-height:52px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:6px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.alt-pick:active{border-color:var(--accent)}
.alt-pick b{font-size:15px;font-weight:750}
.alt-pick .pill{padding:1px 7px;font-size:10px;vertical-align:1px}
.alt-pick .sub{font-size:12px}
.eq{display:inline-block;padding:0 6px;border-radius:5px;background:rgba(212,255,58,.12);color:var(--accent);font-weight:700;font-size:11px}
.chk{display:flex;align-items:flex-start;gap:12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto}
.coach-card{border-color:rgba(212,255,58,.35);background:radial-gradient(120% 140% at 100% 0%,rgba(212,255,58,.12),transparent 55%),var(--card)}
.coach-btn svg{width:18px;height:18px}
.coach-card .coach-btn{margin-top:12px;height:52px;font-size:16px}
.banner.sunday{align-items:flex-start}
.banner-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
textarea.inp.coach-txt{height:46vh;min-height:220px;margin-top:12px;padding:12px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;resize:vertical}
.onboard{border-color:var(--accent);background:radial-gradient(120% 140% at 100% 0%,rgba(212,255,58,.2),transparent 60%),var(--card)}
.perf-card{position:relative}
.info-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--muted);font:italic 700 15px Georgia,serif;position:relative}
.info-btn::after{content:"";position:absolute;inset:-6px}
.perf-tip{margin-top:10px;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px}
.perf-tip table{width:100%;border-collapse:collapse;margin-top:6px}
.perf-tip td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top;color:var(--muted)}
.perf-tip td:first-child{color:var(--text);font-weight:700;white-space:nowrap}
.perf-tip td:nth-child(2){color:var(--accent);font-weight:800;text-align:right}
.perf-range .chip{height:36px;font-size:13px}
.perf-main{display:flex;align-items:center;gap:16px;margin-top:12px}
.perf-ring-wrap{position:relative;width:128px;height:128px;flex:0 0 auto}
.perf-ring{width:128px;height:128px}
.perf-ring circle{transition:stroke-dashoffset .6s}
.perf-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.perf-val b{font-size:32px;font-weight:850;letter-spacing:-1px}

.mtab,.nf,.wtab{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}.mtab td,.mtab th,.nf td,.nf th,.wtab td,.wtab th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}.mtab td:first-child,.nf td:first-child,.wtab td:first-child{text-align:left}

.mcard.locked{border-color:var(--accent)}.mi{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.mi .mg{width:64px;height:36px;padding:0 6px;text-align:right}
.mdet{margin-top:8px}.mdet summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}.prep{padding-left:18px;font-size:13px;margin:6px 0}.prep li{margin:4px 0}.tips{font-size:12px;color:var(--muted);padding-left:18px}
.ok{color:var(--good)}.off{color:var(--warn)}.daytot .stat i{font-style:normal;margin-left:4px}.daychips .chip{height:36px}.wk-acts{margin:4px 0 12px}.wk-acts .btn{font-size:13px}
.store .fbtn{min-width:32px;height:32px}.storeform{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.shop-chk{width:22px;height:22px;margin-top:3px;flex:0 0 auto;accent-color:var(--accent)}.store b{word-break:break-word}.shop-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.shop-item.got b{text-decoration:line-through;color:var(--muted)}.shop-item.have{opacity:.55}
.shop-meta{gap:10px;align-items:center;margin-top:4px}.inp.sm{height:32px;font-size:13px;padding:0 8px;width:auto}.price-row{gap:6px;align-items:center;margin-top:6px}.price-row .inp{width:80px}

/* ================= How-to (exercise demos + form cues) =================

const HOWTO = {
  "Bench press":{"m":"Chest · front delts · triceps","v":["gRVjAtPip0Y","How to Perform Bench Press - Tutorial & Proper Form","Buff Dudes"],"c":["Eyes under the bar, feet flat, shoulder blades squeezed together and down. Grip just wider than shoulders.","Unrack, lower the bar under control to mid/lower chest (elbows ~45° from your sides), then press up and slightly back over your shoulders.","Chest and triceps doing the work; upper back stays tight against the bench.","Bouncing the bar off your chest, flaring elbows straight out, or lifting your butt off the bench."],"tip":"Start with the empty bar (45 lb) or dumbbells. Always use safety arms or a spotter. Machine chest press is a great substitute while you learn.","e":"Barbell"},
  "Incline DB press":{"m":"Upper chest · front delts · triceps","v":["8iPEnn-ltC8","How To: Dumbbell Incline Chest Press","ScottHermanFitness"],"c":["Bench at 30–45°. Sit with dumbbells on your thighs, kick them up one at a time as you lie back; pinch shoulder blades.","Press up over your upper chest, then lower slowly until the dumbbells are about chest level, elbows slightly tucked.","A stretch across the upper chest at the bottom; upper chest and front shoulders working.","Bench too steep (turns it into a shoulder press) or clanging the dumbbells together at the top."],"tip":"Pick a weight you can control for every rep: start lighter than you think. Machine incline press or incline push-ups are easy alternatives.","e":"Dumbbell"},
  "Seated cable row":{"m":"Mid-back · lats · biceps","v":["GZbfZ033f74","How To: Seated Low Row (LF Cable)","ScottHermanFitness"],"c":["Feet on the platform, knees slightly bent, sit tall with chest up and arms long holding the handle.","Pull the handle to your belly button by driving elbows back, squeeze shoulder blades together, then let your arms extend slowly.","Muscles around and between your shoulder blades and your lats, not your lower back.","Rocking your torso back and forth to move the weight, or shrugging shoulders up to your ears."],"tip":"Keep your torso nearly still. If you have to swing, lower the weight. A seated row machine with a chest pad is an easy alternative.","e":"Cable"},
  "Overhead DB press":{"m":"Shoulders · triceps","v":["qEwKCR5JCog","How To: Dumbbell Shoulder Press","ScottHermanFitness"],"c":["Sit on an upright bench with back support, dumbbells at shoulder height, palms forward, core braced.","Press up until arms are nearly straight overhead, then lower with control to about ear/chin level.","Front and side shoulders plus triceps.","Arching your lower back off the pad or banging the dumbbells together at the top."],"tip":"Seated with back support is the most beginner-friendly version. A shoulder press machine is a great substitute.","e":"Dumbbell"},
  "Lateral raises":{"m":"Side delts","v":["3VcKaXpzqRo","How To: Dumbbell Side Lateral Raise","ScottHermanFitness"],"c":["Stand tall with light dumbbells at your sides, a slight bend in the elbows, leaning a touch forward.","Raise arms out to the sides to shoulder height, leading with the elbows, pause, then lower slowly (2–3 s).","The side of your shoulders burning, not your neck or traps.","Swinging with momentum, going too heavy, or shrugging toward your ears."],"tip":"Go light: 5–15 lb is normal here! Cable lateral raises or the lateral raise machine are good alternatives.","e":"Dumbbell"},
  "Triceps rope pushdown":{"m":"Triceps","v":["qHDrQglWgS4","How to Perform Cable Rope Pushdown | Triceps Exercise Tutorial","Buff Dudes Workouts"],"c":["Rope at the top of the cable, stand close with a slight forward lean, elbows pinned at your sides.","Push the rope down until arms are straight, spread the rope ends apart at the bottom, return slowly until forearms are about parallel to the floor.","Back of the upper arm (triceps).","Elbows drifting forward/up or leaning your body weight into the stack."],"tip":"Only your forearms should move. A straight-bar attachment or a triceps machine works too.","e":"Cable"},
  "Back squat":{"m":"Quads · glutes · core","v":["7v_V6xiA_AA","How to Perform A Back Squat","Squat University"],"c":["Bar on your upper back (not your neck), rack at mid-chest height. Feet shoulder-width, toes slightly out. Big breath, brace your core.","Sit down between your hips with knees tracking over your toes, to about thighs parallel (or as deep as your back stays neutral), then drive up through the whole foot.","Quads and glutes working; torso tight and chest proud the whole rep.","Knees caving inward, heels lifting, or your lower back rounding at the bottom."],"tip":"Learn with a goblet squat or the empty bar first, and set the rack safety pins just below your bottom position. Leg press or a Smith machine squat are alternatives.","e":"Barbell"},
  "Romanian deadlift":{"m":"Hamstrings · glutes · lower back","v":["_oyxCn2iSjU","HOW TO DO ROMANIAN DEADLIFTS (RDLs): Build Beefy Hamstrings With Perfect Technique","Jeff Nippard"],"c":["Stand holding the bar (or dumbbells) at your thighs, feet hip-width, soft knees, shoulders back.","Push your hips BACK and slide the weight down your thighs with a flat back until you feel a strong hamstring stretch (usually around mid-shin); squeeze glutes to stand up.","A big stretch in the hamstrings, with your glutes finishing the rep.","Rounding your back, or bending the knees so much it turns into a squat."],"tip":"Start with dumbbells and check a side view in the mirror. Practice the hip hinge with a broomstick along your spine. Substitute: 45° back extension.","e":"Barbell"},
  "Leg press":{"m":"Quads · glutes","v":["oujca3_Shgw","How To: Leg Press (Cybex)","ScottHermanFitness"],"c":["Back and hips flat against the pad, feet shoulder-width in the middle of the platform.","Release the safeties, lower the sled until knees are about 90° (without your hips curling off the pad), then press back up through the whole foot.","Quads and glutes.","Snapping your knees locked at the top, or letting your lower back lift off the seat at the bottom."],"tip":"Start light and keep the safety handles within reach. Feet higher on the platform = more glutes; lower = more quads.","e":"Machine"},
  "Seated leg curl":{"m":"Hamstrings","v":["t9sTSr-JYSs","Beginner's Guide: Seated Leg Curl","SilverSneakers"],"c":["Adjust the machine so your knees line up with its pivot point, the thigh pad snug and the ankle pad just above your heels.","Curl your heels toward your butt, squeeze for 1 s, then return slowly (2–3 s) to straight legs.","Back of your thighs (hamstrings).","Jerking the weight with momentum, or lifting your hips off the pad (lying version)."],"tip":"Seated or lying machines both work. The slow lowering is where most of the benefit is.","e":"Machine"},
  "Standing calf raise":{"m":"Calves","v":["YMmgqO8Jo-k","How To: Standing Calf (BM)","ScottHermanFitness"],"c":["Balls of your feet on the edge of the platform, heels hanging, legs straight but not locked.","Lower your heels into a deep stretch, pause 1 s, then rise as high as you can onto your toes and pause 1 s at the top.","Calves burning, especially with slow reps.","Fast, bouncy half-reps."],"tip":"No machine? Do them on a step holding a dumbbell, with a hand on a rail for balance. Leg-press calf raises also work.","e":"Machine"},
  "Plank":{"m":"Core (abs, obliques)","v":["EtO0CutfR8Y","How to do a PROPER Plank","Mind Pump TV"],"c":["Forearms on the floor, elbows under shoulders, legs straight, feet hip-width.","Squeeze your glutes and brace your abs so your body is a straight line from head to heels; keep breathing and hold.","Abs working hard; shoulders stable.","Hips sagging (strains your low back) or piking your hips up high."],"tip":"Too hard? Plank from your knees or with hands on a bench, and build up in 10–15 s chunks.","e":"Bodyweight"},
  "Lat pulldown":{"m":"Lats · upper back · biceps","v":["an1BMInTXLk","How To Actually Target Your Lats With The Lat Pulldown!","Mind Pump TV"],"c":["Thighs locked under the pads, grip slightly wider than shoulders, sit tall with a slight lean back.","Pull the bar to your upper chest by driving your elbows down toward your ribs, then let it rise under control to a full stretch.","Lats: the sides of your back, under your armpits.","Leaning way back and yanking, or pulling the bar behind your neck."],"tip":"Think \"elbows to back pockets.\" This is the best way to build up to pull-ups; a neutral-grip handle is easier on the shoulders.","e":"Machine"},
  "Chest-supported row":{"m":"Upper back · lats · rear delts","v":["H75im9fAUMc","Chest-Supported Row","Men's Health"],"c":["Chest on an incline bench (30–45°) or machine pad, dumbbells hanging straight down.","Row the weights up by driving your elbows back toward your hips, squeeze shoulder blades for 1 s, lower slowly.","Mid/upper back between your shoulder blades.","Lifting your chest off the pad to heave the weight, or shrugging."],"tip":"The chest support protects your lower back, which makes it great for beginners. A T-bar or seated row machine is a good swap.","e":"Dumbbell"},
  "Incline barbell press":{"m":"Upper chest · front delts · triceps","v":["jPLdzuHckI8","Incline Barbell Press | Upper Chest | How-To Exercise Tutorial","Buff Dudes Workouts"],"c":["Bench at about 30°, eyes under the bar, shoulder blades tucked, feet planted.","Lower the bar to your upper chest (just below the collarbone) under control, then press straight up.","Upper chest and triceps.","Bouncing the bar, flaring your elbows out to 90°, or arching off the bench."],"tip":"Use safeties or a spotter. The incline machine or Smith press are easy, safe swaps (tap Replace).","e":"Barbell"},
  "Face pulls":{"m":"Rear delts · upper back · rotator cuff","v":["eFxMixk_qPQ","Rope Face Pull","Men's Health"],"c":["Rope at upper-chest to face height. Grip with thumbs pointing back toward you, step back until your arms are straight.","Pull the rope toward your face, splitting the ends apart and finishing with hands beside your ears (like a double-biceps pose); return slowly.","Back of your shoulders and between your shoulder blades.","Going heavy and leaning back. This is a light, controlled posture exercise."],"tip":"Light weight, slow reps, 1 s pause. Band pull-aparts or the reverse pec-deck are alternatives.","e":"Cable"},
  "DB curls":{"m":"Biceps","v":["sAq_ocpRh_I","How To: Alternating Dumbbell Curl","ScottHermanFitness"],"c":["Stand tall, dumbbells at your sides, palms forward, elbows by your ribs.","Curl up by bending only at the elbow, squeeze at the top, lower slowly to a full arm extension.","Front of the upper arm (biceps).","Swinging your torso or letting your elbows drift forward."],"tip":"Alternate arms or sit on a bench to stop swinging. Cable curls or the biceps curl machine are good swaps.","e":"Dumbbell"},
  "Hammer curls":{"m":"Biceps · brachialis · forearms","v":["BRVDS6HVR9Q","How To Perform HAMMER CURLS | Biceps Exercise Tutorial","Buff Dudes Workouts"],"c":["Stand tall, dumbbells at your sides with palms facing each other (neutral grip).","Curl up keeping your palms facing in and elbows pinned, then lower slowly.","Biceps and the outer forearm.","Swinging the weights or shrugging your shoulders."],"tip":"A cable rope curl is an easy alternative.","e":"Dumbbell"},
  "Trap-bar deadlift":{"m":"Glutes · hamstrings · quads · back · grip","v":["EsqwERaSTMI","How To Trap Bar Deadlift *Build Strength And Size* | Form Check | Men's Health Muscle","Men’s Health Muscle"],"c":["Stand in the middle of the trap bar, hinge down and grip the high handles, chest up, flat back, pull the slack out of the bar, big breath and brace.","Push the floor away with your legs and stand up tall, hips and shoulders rising together. Lower by pushing your hips back along the same path.","Legs and glutes driving, upper back tight, hamstrings loaded.","A rounded lower back, jerking the bar off the floor, or leaning back at the top."],"tip":"The most beginner-friendly deadlift. Start light: 5 clean reps beat heavy ugly ones. End each set about 2 reps before your form would break.","e":"Barbell"},
  "Bulgarian split squat":{"m":"Quads · glutes","v":["7Aqeb8UHl4k","Bulgarian Split Squat","Men's Health"],"c":["Stand about 2 ft in front of a bench, top of your rear foot on the bench, most of your weight on the front leg.","Lower straight down until your back knee nearly touches the floor, then drive up through your front heel.","Front-leg quad and glute, plus a stretch in the rear hip.","Front foot too close to the bench (knee pain) or pushing off with the back leg."],"tip":"Start with body weight and hold a rack or wall for balance. A regular split squat (back foot on the floor) or reverse lunge is easier.","e":"Dumbbell"},
  "Hip thrust":{"m":"Glutes · hamstrings","v":["pBH7pKHn-dI","How to Perform Barbell Hip Thrusts | Glutes Exercise Tutorial","Buff Dudes Workouts"],"c":["Upper back (just below the shoulder blades) against a bench, padded bar over your hips, feet flat about hip-width.","Tuck your chin and drive through your heels to raise your hips until your body is flat like a table (shins vertical); squeeze glutes 1–2 s, lower with control.","Glutes, not your lower back or hamstrings.","Arching your lower back at the top or pushing through your toes."],"tip":"Learn with floor glute bridges or a hip thrust machine first, and always use a bar pad.","e":"Barbell"},
  "Leg extension":{"m":"Quads","v":["ljO4jkwv8wQ","How To Do Leg Extensions With Perfect Technique (Grow Every Quad Head)","Jeff Nippard"],"c":["Line your knee up with the machine's pivot, pad on your lower shins, back against the seat, hold the handles.","Straighten your legs, squeeze your quads for 1 s, then lower slowly (2–3 s).","Front of your thighs.","Kicking the weight up or lifting your butt off the seat."],"tip":"A good beginner exercise. Start light if your knees are sensitive.","e":"Machine"},
  "Seated calf raise":{"m":"Calves (soleus)","v":["JbyjNymZOt0","How to Do Seated Calf Raises","LIVESTRONG"],"c":["Balls of your feet on the platform, pad snug on your lower thighs just above the knees.","Lower your heels for a full stretch, pause, then push up as high as possible and pause at the top.","Lower calves.","Short, bouncy reps."],"tip":"No machine? Sit on a bench with a dumbbell on your knees and your toes on a weight plate.","e":"Machine"},
  "Hanging knee raise":{"m":"Lower abs · hip flexors · grip","v":["X-ACS9vpRyU","How To: Hanging Knee / Leg Raise | BUILD A “SCIENCED BASED” 6-PACK!","ScottHermanFitness"],"c":["Hang from a pull-up bar with straight arms, shoulders engaged (not shrugged), legs together.","Bring your knees up toward your chest while curling your pelvis up, then lower slowly without swinging.","Lower abs.","Swinging and using momentum."],"tip":"Use the captain's chair (forearm supports), or do lying reverse crunches if grip or swinging is a problem.","e":"Bodyweight"},
  "DB bench press":{"m":"Chest · front delts · triceps","v":["VmB1G1K7v94","How To: Dumbbell Chest Press","ScottHermanFitness"],"c":["Sit with dumbbells on your thighs, lie back and kick them up. Feet flat, shoulder blades pinched.","Lower the dumbbells to the sides of your chest (elbows about 45°), then press up and slightly together.","A chest stretch at the bottom, chest and triceps doing the pressing.","Dropping the weights too fast or letting your wrists bend back."],"tip":"To finish, bring the dumbbells to your chest and rock up to sitting with them on your thighs. Machine chest press is an alternative.","e":"Dumbbell"},
  "Pull-ups or assisted":{"m":"Lats · upper back · biceps","v":["wFj808u2HWU","How To Use The Assisted Pull Up Machine","PureGym"],"alt":["eGo4IYlbE5g","The Perfect Pull Up - Do it right!","Calisthenicmovement","Unassisted pull-up"],"c":["Grip slightly wider than shoulders. On the assisted machine, kneel on the pad: more counterweight = more help.","From a dead hang, pull your chest toward the bar by driving your elbows down, then lower all the way under control.","Lats and upper back.","Kicking/kipping or doing half reps."],"tip":"AMRAP = as many good reps as possible. Start assisted (or with lat pulldowns). Next steps: band-assisted reps, then negatives (jump up, lower in 3–5 s).","e":"Bodyweight"},
  "Goblet squat":{"m":"Quads · glutes · core","v":["MeIiIdhvXT4","How To: Goblet Squat","ScottHermanFitness"],"c":["Hold one dumbbell or kettlebell vertically at your chest, elbows under it. Feet shoulder-width, toes slightly out.","Sit down between your heels keeping your chest up (elbows inside your knees at the bottom), then stand up through the whole foot.","Quads and glutes, with your core working to keep you upright.","Heels rising or knees caving in."],"tip":"The best squat for learning. Squat down to a box or bench if depth is tough.","e":"Dumbbell"},
  "Intervals: bike or rower":{"m":"Heart & lungs (conditioning)","v":["Rh8VswzWDow","How To Do A HIIT On An Exercise Bike | The Body Coach","The Body Coach TV by Joe Wicks"],"alt":["4zWu1yuJ0_g","Correct Rowing Machine Technique, Improve Your Rowing | Concept2","concept2usa","Rower technique"],"c":["Bike: seat at hip height so your knee is slightly bent at the bottom. Rower: straps across the widest part of your foot, damper around 3–5.","Warm up 3–5 min easy, then repeat 30 s hard / 90 s easy for 15–20 min, and cool down for 3 min.","Breathing hard during the 30 s pushes (about 7–8/10 effort), recovering during the easy part.","Starting too hard. On the rower: pulling with your arms first. It's legs → body → arms, then reverse on the way back."],"tip":"Start with 6–8 rounds of 20 s hard and build up. Any cardio machine works (elliptical, incline treadmill). If you're new to hard cardio, ask your doctor what intensity is safe for you.","e":"Cardio"},
  "Incline walk":{"m":"Heart & lungs · legs · glutes","v":["NAsObfFJXvE","How To: Incline Treadmill Walk (12-3-30 Workout)","Live Lean TV Daily Exercises"],"c":["Treadmill at 3–8% incline, speed 2.5–3.5 mph (start easier).","Walk tall with a natural arm swing and full foot contact, at a steady pace for 20–30 min.","Warm and breathing harder, but still able to talk (conversation pace).","Holding the handrails. It cuts the work and hurts your posture, so lower the incline or speed instead."],"tip":"Build up the incline over weeks. The video's \"12-3-30\" (12% incline, 3 mph, 30 min) is a goal, not a starting point. Outdoors: hills or brisk walking count too.","e":"Cardio"},
  "Conventional deadlift":{"m":"Glutes · hamstrings · back · grip","e":"Barbell","v":["r4MzxtBKyNE","How To Perfect Your Deadlift | Form Check | Men's Health","Men's Health"],"c":["Bar over mid-foot, feet hip-width, grip just outside your legs; shins touch the bar, chest up, flat back, big breath and brace.","Push the floor away and stand up tall with the bar dragging up your legs; lower by pushing your hips back, bar close.","Legs and glutes driving, lats keeping the bar close, upper back tight.","Rounding your lower back, bar drifting away from your legs, or yanking it off the floor."],"tip":"Learn it light with perfect form. If your back complains, the trap-bar deadlift is a great permanent swap."},
  "Machine chest press":{"m":"Chest · front delts · triceps","e":"Machine","v":["n8TOta_pfr4","How to Use a Chest Press Machine","LIVESTRONG"],"c":["Set the seat so the handles line up with mid-chest; feet flat, back against the pad.","Press the handles forward until arms are almost straight, then return slowly until you feel a chest stretch.","Chest doing most of the work, triceps finishing the press.","Shoulders rolling forward off the pad or letting the stack slam between reps."],"tip":"The easiest press to learn and safe to push hard without a spotter."},
  "Pec deck":{"m":"Chest","e":"Machine","v":["H4mVGHaK2f4","How to PERFECT The Pec Deck | (CHEST FLY MISTAKES & TIPS)","Colossus Fitness"],"c":["Seat height so the handles are at chest level; slight bend in the elbows, back flat on the pad.","Bring the handles together in a wide hugging arc, squeeze 1 s, then open slowly to a comfortable stretch.","Inner and middle chest squeezing.","Letting the arms travel too far back or turning it into a press by bending the elbows a lot."],"tip":"Keep the weight moderate and the reps slow. It's a squeeze exercise, not a max-strength lift."},
  "Cable fly":{"m":"Chest","e":"Cable","v":["8Um35Es-ROE","How To: Cable Fly (High-To-Low) || 3 GOLDEN RULES","ScottHermanFitness"],"c":["Pulleys at shoulder height or higher, one handle in each hand, a small step forward in a split stance.","With a soft bend in the elbows, bring your hands together in front of your chest in a wide arc, then open slowly.","Chest stretching as your arms open and squeezing as they meet.","Bending and straightening the elbows (turning it into a press) or using too much weight."],"tip":"Pec deck or DB flys are good substitutes. Think 'hug a big tree'."},
  "Incline machine press":{"m":"Upper chest · front delts · triceps","e":"Machine","v":["ig0NyNlSce4","How To: Incline Chest Press (Hammer Strength)","ScottHermanFitness"],"c":["Set the seat so the handles start around upper-chest height; back against the pad.","Press up and forward until arms are nearly straight, lower slowly to a light stretch.","Upper chest and triceps working.","Lifting your hips or shrugging your shoulders up."],"tip":"Great option when you train alone. Controlled 2–3 s lowering on every rep."},
  "Low-to-high cable fly":{"m":"Upper chest","e":"Cable","v":["eQ_NBB6OBH4","HOW TO: Chest \"Low-To-High\" Cable Fly (BIGGER UPPER CHEST) || PERFECT FORM","ScottHermanFitness"],"c":["Pulleys at the lowest setting, handles in hand, stand in the middle with a split stance.","Sweep your hands up and in to meet at upper-chest/chin height, elbows softly bent; lower slowly.","Upper chest squeezing at the top.","Leaning back or shrugging to lift the weight."],"tip":"Use light weight and pause 1 s at the top."},
  "DB fly":{"m":"Chest","e":"Dumbbell","v":["eozdVDA78K0","How To: Dumbbell Flys On A Flat Bench","ScottHermanFitness"],"c":["Lie on a flat bench, dumbbells over your chest, palms facing each other, slight bend in elbows.","Open your arms in a wide arc until you feel a good chest stretch (about bench level), then hug them back up.","A strong stretch across the chest at the bottom.","Going too deep or too heavy, which stresses the shoulders."],"tip":"Keep it light (often half your DB press weight). Pec deck is a safer machine version."},
  "Push-ups":{"m":"Chest · triceps · core","e":"Bodyweight","v":["IODxDxX7oi4","The Perfect Push Up | Do it right!","Calisthenicmovement"],"c":["Hands slightly wider than shoulders, body straight from head to heels, glutes and abs tight.","Lower your chest to just above the floor with elbows about 45° from your body, then push back up.","Chest and triceps working, core holding you straight.","Hips sagging, flaring elbows straight out, or doing half reps."],"tip":"Too hard? Put your hands on a bench or bar (incline push-up). 'AMRAP' = as many good reps as possible."},
  "Smith machine bench press":{"m":"Chest · front delts · triceps","e":"Machine","v":["z_r6hDOYtO0","How To: Smith Machine- Bench Press","ScottHermanFitness"],"c":["Set the bench so the bar comes down to your mid/lower chest; set the safety stops just above chest height.","Unhook, lower the bar under control to your chest, press back up.","Chest and triceps working with the bar path guided for you.","Bench in the wrong spot so the bar lands on your neck or belly."],"tip":"A good stepping stone to the barbell bench: stable and easy to rack anytime."},
  "Incline Smith press":{"m":"Upper chest · front delts · triceps","e":"Machine","v":["b8DqTO6ak0k","How To: Smith Machine- Incline Bench Press","ScottHermanFitness"],"c":["Incline bench at 30° under the Smith bar so the bar lands on your upper chest; set the safeties.","Unhook, lower to the upper chest, press straight up.","Upper chest and triceps.","Bench too steep (becomes a shoulder press) or bouncing off the chest."],"tip":"Check the bench position with an empty bar first."},
  "Landmine press":{"m":"Upper chest · shoulders · triceps","e":"Barbell","v":["1G-_FTEkoNw","How to Perform Landmine Chest Press - Upper Chest Exercise","Buff Dudes"],"c":["One end of a barbell in a landmine (or corner), hold the other end at your chest, staggered stance.","Press the bar up and forward until your arm is straight, then lower back to the chest.","Upper chest and front shoulder, core stabilizing.","Leaning back a lot or shrugging."],"tip":"Very shoulder-friendly. Start with just the bar."},
  "Seated DB overhead extension":{"m":"Triceps (long head)","e":"Dumbbell","v":["YbX7Wd8jQ-Q","How To: Dumbbell Seated Overhead Tricep Extension","ScottHermanFitness"],"c":["Sit on an upright bench, hold one dumbbell with both hands overhead, elbows pointing up.","Lower the dumbbell behind your head by bending only at the elbows, then straighten your arms.","A deep stretch in the back of the arms, then triceps squeezing.","Elbows flaring wide or arching your lower back."],"tip":"Start light: the stretch position is demanding. Cable overhead extension is a smooth alternative."},
  "Overhead cable triceps extension":{"m":"Triceps (long head)","e":"Cable","v":["GzmlxvSFE7A","How to PROPERLY Overhead Cable Tricep Extension | Fix Your Tricep Extension Form NOW!","Colossus Fitness"],"c":["Rope on a low or mid pulley, face away, rope behind your head, staggered stance with a slight lean.","Extend your arms forward/up until straight, then let the rope come back behind your head slowly.","Stretch then squeeze in the back of the upper arms.","Moving your elbows around or using your back to push."],"tip":"Keep your elbows pointing forward and still; only the forearms move."},
  "Straight-bar pushdown":{"m":"Triceps","e":"Cable","v":["_w-HpW70nSQ","HOW TO: Cable Triceps Pushdown || 3 Golden Rules (FOR GROWTH)","ScottHermanFitness"],"c":["Straight or angled bar on a high pulley, overhand grip, elbows at your sides, slight forward lean.","Push the bar down until your arms are straight, pause, return until forearms are about parallel to the floor.","Triceps working.","Elbows drifting forward or leaning over the bar to push with body weight."],"tip":"If your wrists complain, use the rope or a V-bar."},
  "Close-grip bench press":{"m":"Triceps · chest","e":"Barbell","v":["nEF0bv2FW94","How To: Close-Grip Barbell Bench Press","ScottHermanFitness"],"c":["Lie on the bench, grip about shoulder-width (not closer), shoulder blades tucked.","Lower the bar to your lower chest with elbows close to your sides, press back up.","Triceps doing a lot of the work, plus chest.","Grip too narrow (wrist pain) or elbows flaring out."],"tip":"Use safeties or a spotter. Smith machine or close-grip push-ups are alternatives."},
  "EZ-bar skull crusher":{"m":"Triceps","e":"Barbell","v":["d_KZxkY_0cM","How To: Skull Crushers","ScottHermanFitness"],"c":["Lie on a bench holding an EZ-bar over your shoulders with a narrow grip.","Bend only at the elbows to lower the bar toward your forehead/just behind your head, then straighten.","Triceps stretching and contracting.","Elbows flaring wide or letting the upper arms swing."],"tip":"Go light and slow. Lowering slightly behind the head is easier on the elbows."},
  "Assisted dips":{"m":"Triceps · chest","e":"Machine","v":["yZ83t4mrPrI","Assisted Dip","Renaissance Periodization"],"c":["Set the counterweight (more weight = more help), kneel or stand on the pad, grip the handles with arms straight.","Lower until your upper arms are about parallel to the floor, then push back up to straight arms.","Triceps and lower chest.","Going too deep or letting shoulders roll forward and shrug up."],"tip":"Upright torso = more triceps; leaning forward = more chest. Stop if shoulders feel pinchy."},
  "Triceps dip machine":{"m":"Triceps","e":"Machine","v":["EBnq0A5L_wo","How to PROPERLY Use The Tricep Dip Machine (TRY THIS)","Colossus Fitness"],"c":["Sit with the handles by your sides, back against the pad.","Push the handles down until your arms are straight, then return slowly until elbows are about 90°.","Triceps working.","Shrugging your shoulders up or rocking forward."],"tip":"A very beginner-friendly triceps builder."},
  "Close-grip push-up":{"m":"Triceps · chest","e":"Bodyweight","v":["8_ILkbB9an8","How to PROPERLY Diamond Push-Up (Close Grip Push-Up) For Muscle Gain","Colossus Fitness"],"c":["Hands under your shoulders or slightly closer, body in a straight plank.","Lower with elbows brushing your ribs, then push back up.","Triceps burning, chest assisting.","Hands so close your wrists hurt, or sagging hips."],"tip":"Do them on a bench (incline) until you can do 10 on the floor."},
  "Bench dips":{"m":"Triceps","e":"Bodyweight","v":["c3ZGl4pAwZ4","How To: Bench Dip","ScottHermanFitness"],"c":["Hands on the edge of a bench behind you, fingers forward, legs bent in front.","Lower by bending the elbows to about 90°, keeping your back close to the bench, then press up.","Triceps.","Dropping too low (strains the front of the shoulders)."],"tip":"Keep knees bent to make it easier. Skip it if your shoulders are cranky."},
  "Barbell row":{"m":"Upper back · lats · biceps","e":"Barbell","v":["9efgcAjQe7E","How To: Barbell Bent-Over Row","ScottHermanFitness"],"c":["Hold the bar with an overhand grip, hinge forward to about 45° with a flat back, knees soft.","Row the bar to your lower ribs by driving elbows back, squeeze, lower under control.","Mid-back and lats working; hamstrings holding the hinge.","Standing up with each rep or rounding your back."],"tip":"Start light to own the hinge. Chest-supported rows take stress off the lower back."},
  "One-arm DB row":{"m":"Lats · upper back · biceps","e":"Dumbbell","v":["roCP6wCXPqo","How to Perfect Your Dumbbell Row | Form Check | Men's Health","Men's Health"],"c":["One hand and knee on a bench, other foot on the floor, back flat, dumbbell hanging straight down.","Pull the dumbbell toward your hip, elbow close to your body, then lower all the way.","Lats (side of your back) and mid-back.","Twisting your torso to heave the weight up."],"tip":"Think 'elbow to back pocket'. A great back builder with minimal equipment."},
  "Close-grip lat pulldown":{"m":"Lats · mid-back · biceps","e":"Machine","v":["ecRF8ERf2q4","Close Grip Front Lat Pulldown - Back Exercise - Bodybuilding.com","Bodybuilding.com"],"c":["Attach a close/neutral V-handle, thighs locked under the pads, sit tall.","Pull the handle to your upper chest, driving elbows down and back, then control it up to a full stretch.","Lats and between the shoulder blades.","Leaning way back or cutting the stretch short at the top."],"tip":"Neutral grips are usually the most comfortable for the shoulders."},
  "T-bar row":{"m":"Mid-back · lats · traps","e":"Barbell","v":["j3Igk5nyZE4","How To: T-Bar Row","ScottHermanFitness"],"c":["Stand over the bar or machine, hinge forward with a flat back, grip the handles.","Row the handles to your chest/stomach, squeeze your shoulder blades, lower slowly.","Thick middle back working.","Rounding your back or jerking the weight."],"tip":"The chest-supported T-bar machine is easier on the lower back."},
  "Straight-arm pulldown":{"m":"Lats","e":"Cable","v":["soX7zhZ7yfQ","Build your LATS with Straight Arm Pulldowns | Exercise Tutorial","Buff Dudes Workouts"],"c":["Bar or rope on a high pulley, step back, hinge slightly, arms nearly straight in front.","Sweep the bar down to your thighs keeping elbows almost straight, then let it rise slowly.","Lats working through a long arc; great mind-muscle connection.","Bending the elbows (turns into a pushdown) or using your body to swing."],"tip":"Light weight and a slow squeeze. Good warm-up for pulldowns too."},
  "Machine row":{"m":"Mid-back · lats · biceps","e":"Machine","v":["TeFo51Q_Nsc","How To Use The Seated Row Machine","PureGym"],"c":["Adjust the seat so the handles are at mid-chest, chest against the pad.","Pull the handles back by driving your elbows, squeeze your shoulder blades, return slowly.","Middle back.","Lifting your chest off the pad or shrugging."],"tip":"Stable and simple: ideal for pushing close to failure safely."},
  "Single-arm lat pulldown":{"m":"Lats","e":"Cable","v":["DU7m4f63gko","How to Single-Arm Lat Pulldown | Target Your Lower Lats","Physique Development"],"c":["Single handle on a high pulley, kneel or sit so your arm is fully stretched overhead.","Pull the elbow down toward your hip, then let the arm rise to a full stretch.","A strong lat contraction on one side.","Rotating your torso to finish the rep."],"tip":"Great for evening out left/right differences."},
  "DB pullover":{"m":"Lats · chest","e":"Dumbbell","v":["tpLnfSQJ0gg","How To: Dumbbell Pull-Over","ScottHermanFitness"],"c":["Lie on a bench holding one dumbbell with both hands over your chest, elbows slightly bent.","Lower the dumbbell back behind your head in an arc until you feel a stretch, then pull it back over your chest.","Stretch in the lats and chest.","Bending the elbows a lot or going too heavy."],"tip":"Keep your ribs down; move only at the shoulders."},
  "Inverted row":{"m":"Upper back · biceps","e":"Bodyweight","v":["11F_O_sZ1Z4","How to Perform the Inverted Row | Back | Exercise Tutorial","Buff Dudes Workouts"],"c":["Set a bar at waist height (Smith machine or rack), hang underneath with body straight, heels on the floor.","Pull your chest to the bar, squeeze, lower until arms are straight.","Upper back and rear shoulders.","Hips sagging or craning your neck to the bar."],"tip":"Easier with the bar higher or knees bent."},
  "Reverse pec deck":{"m":"Rear delts · upper back","e":"Machine","v":["6yMdhi2DVao","How To Properly Use The Rear Delt Fly Machine (+ BONUS TIP)","Mind Pump TV"],"c":["Face the pec deck pad, handles set to the rear-delt position, arms straight in front.","Sweep your arms out and back to shoulder level, pause, return slowly.","Back of the shoulders.","Squeezing shoulder blades hard and shrugging (turns it into a trap exercise)."],"tip":"Light weight, higher reps (12–20)."},
  "Rear delt DB fly":{"m":"Rear delts · upper back","e":"Dumbbell","v":["ttvfGg9d76c","How To: Dumbbell Bent-Over Raise","ScottHermanFitness"],"c":["Hinge forward (or lie chest-down on an incline bench) with light dumbbells hanging down.","Raise your arms out to the sides with a soft elbow bend until level with your torso, lower slowly.","Rear shoulders.","Swinging your torso or using heavy weights."],"tip":"Chest-supported on an incline bench makes it stricter and easier on the back."},
  "DB shrug":{"m":"Upper traps","e":"Dumbbell","v":["cJRVVxmytaM","How To: Dumbbell Shrugs","ScottHermanFitness"],"c":["Stand tall holding dumbbells at your sides.","Lift your shoulders straight up toward your ears, hold 1 s, lower all the way.","Upper traps (between neck and shoulders).","Rolling your shoulders in circles or bending the elbows."],"tip":"Pause at the top. Straps help if grip gives out first."},
  "Barbell shrug":{"m":"Upper traps","e":"Barbell","v":["NAqCVe2mwzM","How to Do a Standing Barbell Shrug | Back Workout","Howcast"],"c":["Hold a barbell at your thighs with an overhand grip about shoulder-width.","Shrug straight up, pause, lower under control.","Upper traps.","Using the legs to bounce the bar or rolling the shoulders."],"tip":"Use a rack at knee height to start safely."},
  "Cable rear delt fly":{"m":"Rear delts","e":"Cable","v":["lq9K3lnHWKk","How To PROPERLY Perform a Standing Cable Rear Delt Fly","Colossus Fitness"],"c":["Set both pulleys at shoulder height, cross the cables (left hand holds right cable), step back.","Pull your arms apart and back in a wide arc, pause, return slowly.","Back of the shoulders.","Leaning back or shrugging."],"tip":"Can also be done with no handles, holding the cable balls."},
  "Band pull-apart":{"m":"Rear delts · upper back","e":"Band","v":["3OYSIWaJJk4","The Band Pull-Apart for a Stronger Back","Men's Health"],"c":["Hold a light band at shoulder height, arms straight, hands shoulder-width.","Pull the band apart until it touches your chest, squeeze your shoulder blades, return slowly.","Upper back and rear shoulders.","Arching your back or shrugging."],"tip":"Perfect warm-up or home substitute for face pulls."},
  "Smith machine shrug":{"m":"Upper traps","e":"Machine","v":["LI3b05LUdpA","How To PROPERLY Smith Machine Shrug | 3 Shoulder Shrug Variations for Muscle Gain","Colossus Fitness"],"c":["Set the bar at mid-thigh, grip just outside your thighs.","Unhook and shrug straight up, pause, lower fully.","Upper traps.","Bending the elbows or bouncing."],"tip":"The fixed path lets you focus on the squeeze."},
  "Cable shrug":{"m":"Upper traps","e":"Cable","v":["Wab3-dsZohU","Cable Shrug - The Proper Lift - BPI Sports","BPI Sports"],"c":["Bar on a low pulley, stand close holding it at your thighs.","Shrug straight up, pause 1 s, lower slowly.","Upper traps.","Rolling your shoulders."],"tip":"Constant tension from the cable makes light weights effective."},
  "EZ-bar curl":{"m":"Biceps","e":"Barbell","v":["zG2xJ0Q5QtI","How To: Inside-Grip Bicep Curl With E-Z Bar Curl","ScottHermanFitness"],"c":["Stand tall holding an EZ-bar on the angled grips, elbows at your sides.","Curl up by bending only at the elbows, squeeze, lower slowly to straight arms.","Biceps.","Swinging your back or elbows drifting forward."],"tip":"The angled grip is easier on the wrists than a straight bar."},
  "Cable curl":{"m":"Biceps","e":"Cable","v":["NFzTWp2qpiE","How To Do Cable Bicep Curls - Full Video Tutorial and Step-by-Step Guide","Fit Father Project - Fitness For Busy Fathers"],"c":["Bar on a low pulley, stand close, elbows pinned at your sides.","Curl the bar up to your chest, squeeze, lower until arms are straight.","Biceps under constant tension.","Leaning back to move the weight."],"tip":"Good for slow, controlled reps and drop sets."},
  "Incline DB curl":{"m":"Biceps (long head)","e":"Dumbbell","v":["soxrZlIl35U","How To: Seated Incline Dumbbell Bicep Curl","ScottHermanFitness"],"c":["Sit back on an incline bench (45–60°), arms hanging straight down, palms forward.","Curl the dumbbells up without moving your upper arms, lower slowly to a full stretch.","Big stretch then squeeze in the biceps.","Swinging the elbows forward."],"tip":"Go lighter than standing curls: the stretch makes it harder."},
  "Cable rope hammer curl":{"m":"Biceps · brachialis · forearms","e":"Cable","v":["1Quc_tOv97I","How To: Rope Hammer Curl","ScottHermanFitness"],"c":["Rope on a low pulley, palms facing each other, elbows at your sides.","Curl the rope up toward your shoulders, squeeze, lower slowly.","Biceps and outer forearms.","Swinging or letting elbows travel forward."],"tip":"Keeps tension the whole rep. An easy swap for hammer curls."},
  "Preacher curl":{"m":"Biceps","e":"Barbell","v":["Gydpcouclx8","Conquer the EZ-Bar Preacher Curl, Max Out Your Biceps","Men's Health"],"c":["Sit at the preacher bench, armpits snug on the top of the pad, hold an EZ-bar or use the machine.","Curl up, squeeze, lower slowly until arms are nearly straight.","Biceps, especially at the bottom stretch.","Dropping fast into the bottom or lifting your elbows off the pad."],"tip":"The machine preacher curl is a great beginner version."},
  "Barbell curl":{"m":"Biceps","e":"Barbell","v":["JJB8XgKltA8","BARBELL CURLS | Biceps | How-To Exercise Tutorial","Buff Dudes Workouts"],"c":["Stand tall, shoulder-width underhand grip, elbows at your sides.","Curl the bar to your upper chest, squeeze, lower under control.","Biceps.","Rocking your hips/back to swing the bar."],"tip":"If wrists hurt, use the EZ-bar."},
  "Concentration curl":{"m":"Biceps","e":"Dumbbell","v":["Jvj2wV0vOYU","How To: Dumbbell Concentration Curl","ScottHermanFitness"],"c":["Sit on a bench, elbow braced against the inside of your thigh, dumbbell hanging down.","Curl up toward your shoulder, squeeze hard, lower slowly.","A strong biceps peak contraction.","Moving the upper arm or leaning back."],"tip":"Great finisher; use a light weight and perfect reps."},
  "Reverse curl":{"m":"Forearms · brachialis","e":"Barbell","v":["ypfd1kaI1AU","Reverse Curl Exercise Tutorial | Fast Track Forearm Growth With One Exercise","Buff Dudes Workouts"],"c":["Hold an EZ-bar or barbell with an overhand (palms down) grip, elbows at your sides.","Curl up keeping wrists straight, lower slowly.","Top of the forearms and outer upper arm.","Swinging, or letting your wrists bend."],"tip":"Use about half your normal curl weight."},
  "Walking lunges":{"m":"Quads · glutes","e":"Dumbbell","v":["Pbmj6xPo-Hw","Walking Lunges Exercise Tutorial | Build Legendary Legs & Cardio","Buff Dudes Workouts"],"c":["Stand tall holding dumbbells (or no weight to start).","Take a long step, lower until the back knee nearly touches the floor, push through the front heel and step into the next lunge.","Front-leg quads and glutes.","Front knee caving in or short choppy steps."],"tip":"Learn them stationary (split squat) first. Hold a rail if balance is tricky."},

/* ================= Utils ================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const dkey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return dkey(d); };
const diffDays = (a,b) => Math.round((parseKey(b)-parseKey(a))/864e5);
const today = () => dkey();
const fmtDate = (k,opt={month:'short',day:'numeric'}) => parseKey(k).toLocaleDateString(undefined,opt);
const fmtLong = k => parseKey(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = n => Math.round(n*10)/10;
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const fmtN = n => Number(n).toLocaleString();
const mondayOf = k => { const d = parseKey(k); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return dkey(d); };

let S;
function load(){
  let raw=null;
  try{ raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); S = normalize(raw); }
  catch(e){ console.warn('Load failed, starting fresh', e); S = DEFAULTS(); return; }
  // one-time migration v1 → v2: pin the program start date (first use) so the week number never drifts
  if(!raw || JSON.stringify(raw.program)!==JSON.stringify(S.program)) save();
}
function normalize(raw){
  const d = DEFAULTS();
  if(!raw || typeof raw !== 'object') return d;
  const obj = o => o && typeof o==='object' && !Array.isArray(o) ? o : {};
  const days = raw.days && typeof raw.days==='object' ? raw.days : {};
  const isKey = k => typeof k==='string' && /^\d{4}-\d{2}-\d{2}$/.test(k);
  // program start: keep saved value; otherwise first use = earliest logged day (logs are always saved to "today")
  const firstUse = Object.keys(days).filter(isKey).sort()[0] || d.program.start;
  return {
    v:2,
    profile:{...d.profile,...(raw.profile||{})},
    targets:{...d.targets,...(raw.targets||{})},
    days,
    weights: Array.isArray(raw.weights) ? raw.weights : [],
    zep: Array.isArray(raw.zep) ? raw.zep : [],
    checkins: Array.isArray(raw.checkins) ? raw.checkins : [],
    // an inferred start (first logged day) is provisional until the user confirms an official start date
    program: {start: isKey(raw.program?.start) ? raw.program.start : firstUse, confirmed: raw.program?.confirmed===true && isKey(raw.program?.start)},
    swaps: {always: obj(raw.swaps?.always), day: obj(raw.swaps?.day)},
    perfWeights: cleanWeights(raw.perfWeights),
    meal: normMeal(raw.meal)
  };
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ toast('⚠️ Could not save (storage full?)'); console.error(e); }
}
function day(k=today()){
  if(!S.days[k]) S.days[k] = {protein:0,calories:0,water:0,steps:0,ex:{},hist:[]};
  const d = S.days[k]; d.ex ||= {}; d.hist ||= [];
  return d;
}
function peekDay(k){ return S.days[k] || {protein:0,calories:0,water:0,steps:0,ex:{},hist:[]}; }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); }

const sortedWeights = () => [...S.weights].filter(w=>w&&w.date&&isFinite(w.lb)).sort((a,b)=>a.date<b.date?-1:1);
function currentWeight(){ const w = sortedWeights(); return w.length ? w[w.length-1].lb : S.profile.start; }
function avgWeight(endKey, days=7){
  const start = addDays(endKey,-(days-1));
  const w = sortedWeights().filter(x=>x.date>=start && x.date<=endKey);
  return w.length ? r1(w.reduce((s,x)=>s+x.lb,0)/w.length) : null;
}
function trend(){
  // linear regression over the last 28 days of weigh-ins
  const w = sortedWeights(); if(w.length<3) return null;
  const last = w[w.length-1].date, from = addDays(last,-27);

  else {
    const p=perfScore(start,k);
    L.push(`Last 7 days: ${p.total==null?'—':p.total+'% ('+perfGrade(p.total).l+')'}${S.program.start>start?` (counted from start date ${dl(S.program.start)})`:''}`);

    const wk=perfWeeks().slice(-4);
    if(wk.length) L.push('By week: ' + wk.map(x=>`Week ${x.w}${x.to>=k?' (so far)':''} ${x.total==null?'—':x.total+'%'}`).join(' · '));

    L.push(`Since start: ${all.total==null?'—':all.total+'%'}`);

  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);

  ta.remove(); return ok;
}

/* ================= Performance scoring (planned vs actual) ================= */
// Scored only from the confirmed official start date. Zepbound / medication logs are never read here.
const PERF_CATS = [
  {id:'workouts', label:'Workouts',  w:35, rule:'Mon–Fri program sessions: sets done ÷ sets planned (swaps count; the optional walk, Sat and Sun are not required).'},
  {id:'protein',  label:'Protein',   w:20, rule:'Full credit at or above your protein minimum; proportional below it.'},
  {id:'calories', label:'Calories',  w:15, rule:'Full credit inside your calorie range; proportional below it, tapering to 0 at 1.5× the max above it.'},
  {id:'steps',    label:'Steps',     w:10, rule:'Daily steps vs the current phase step target, capped at 100%.'},
  {id:'water',    label:'Water',     w:10, rule:'Water vs your daily target (proportional, capped at 100%).'},
  {id:'weighins', label:'Weigh-ins', w:5,  rule:'Daily weigh-in goal; any week with at least one weigh-in scores at least 50%.'},
  {id:'checkins', label:'Check-ins', w:5,  rule:'Sunday weekly check-in saved.'},
  {id:'fiber',    label:'Fiber',     w:0,  optional:true, rule:'Optional (off by default): fiber logged from planned meals vs your fiber target, capped at 100%.'}

const catShown = c => !c.optional || perfW(c.id)>0; // optional categories appear in scores/UI only when weighted
const PERF_DEFAULT_W = Object.freeze(Object.fromEntries(PERF_CATS.map(c=>[c.id,c.w]))); // recommended weights
function cleanWeights(w){ // 0–100 integers per category; missing → recommended; all-zero → recommended
  const o=Object.fromEntries(PERF_CATS.map(c=>{ const v=w&&typeof w==='object'?Number(w[c.id]):NaN; return [c.id, Number.isFinite(v)?Math.max(0,Math.min(100,Math.round(v))):PERF_DEFAULT_W[c.id]]; }));
  return Object.values(o).some(v=>v>0) ? o : {...PERF_DEFAULT_W};
}
const perfW = id => (S.perfWeights && Number.isFinite(S.perfWeights[id])) ? S.perfWeights[id] : PERF_DEFAULT_W[id];
function perfShares(W){ const tot=PERF_CATS.reduce((a,c)=>a+(W[c.id]||0),0); return Object.fromEntries(PERF_CATS.map(c=>[c.id, tot?(W[c.id]||0)/tot*100:0])); }

const weightsCustom = () => PERF_CATS.some(c=>perfW(c.id)!==PERF_DEFAULT_W[c.id]);
const PERF_RANGES = [['week','This week'],['4w','Last 4 weeks'],['all','All time']];
const nextMonday = k => { const dow=parseKey(k).getDay(); return dow===1 ? k : addDays(k,(8-dow)%7); };
const perfStarted = () => !!S.program.confirmed && S.program.start <= today();
function stepTarget(d){
  const n=(phaseOf(clampWeek(progWeekRaw(d))).steps.match(/\d[\d,]*/g)||[]).map(x=>+x.replace(/,/g,'')).filter(x=>x>=1000);
  return n.length ? Math.min(...n) : S.targets.steps;
}
function plannedSets(d){ // lifting days only (Mon–Fri); swaps and renamed exercises count
  const dow=parseKey(d).getDay(); if(dow<1||dow>5) return null;
  const ex=S.days[d]?.ex||{}; let planned=0, done=0;
  for(const e of planFor(clampWeek(progWeekRaw(d)),dow)){
    if(e.name===WALK) continue;
    planned+=e.sets; let got=0;
    for(const n of new Set([swapFor(d,e.name).name, e.name, ...namesFor(e.name)])){ const st=ex[n]; if(st && Array.isArray(st.sets)) got=Math.max(got, st.sets.filter(Boolean).length); }

function dayScores(d, isToday){ // today only counts for a category once something is logged
  const x=S.days[d]||{}, T=S.targets, r={}, due=m=>!isToday || (x[m]||0)>0;
  const ps=plannedSets(d);
  if(ps && ps.planned && (!isToday || ps.done>0)) r.workouts=Math.min(1, ps.done/ps.planned);
  if(due('protein')) r.protein = (x.protein||0)>=T.proMin ? 1 : (x.protein||0)/T.proMin;
  if(due('calories')){ const c=x.calories||0; r.calories = c>=T.calMin && c<=T.calMax ? 1 : c<T.calMin ? c/T.calMin : Math.max(0, 1-2*(c-T.calMax)/T.calMax); }

  if(due('steps')) r.steps = Math.min(1,(x.steps||0)/stepTarget(d));

function perfScore(from, to=today()){

  const k=today(), a = from<S.program.start ? S.program.start : from, b = to>k ? k : to;

  const wset=new Set(S.weights.map(w=>w.date)), ciset=new Set(S.checkins.map(c=>c.date)), weeks={};
  for(let d=a; d<=b; d=addDays(d,1)){
    const isT = d===k, r=dayScores(d,isT);
    for(const id in r){ acc[id].sum+=r[id]; acc[id].n++; }
    if(!isT || wset.has(d)){ const wk=(weeks[mondayOf(d)] ||= {due:0,got:0}); wk.due++; if(wset.has(d)) wk.got++; }
    if(parseKey(d).getDay()===0 && (!isT || ciset.has(d))){ acc.checkins.n++; if(ciset.has(d)) acc.checkins.sum++; }
  }
  for(const m in weeks){ const wk=weeks[m]; acc.weighins.sum += Math.max(wk.got/wk.due, wk.got?0.5:0)*wk.due; acc.weighins.n += wk.due; }
  const cats={}; let tw=0, ts=0;
  for(const c of PERF_CATS){ const q=acc[c.id];
    const w=perfW(c.id); // weights are relative: the total uses each weight's share of the sum (0 = not scored)
    if(q.n){ const raw=q.sum/q.n; cats[c.id]={pct:Math.round(raw*100), raw, n:q.n, off:w===0}; if(w>0){ tw+=w; ts+=w*raw; } } else cats[c.id]=null; }

function perfRange(key){ const k=today(); return key==='week' ? [mondayOf(k),k] : key==='4w' ? [addDays(k,-27),k] : [S.program.start,k]; }
function perfWeeks(){ // one entry per program week from the start date through this week

  for(let w=1; w<=cur; w++){ const f=addDays(progStart(),(w-1)*7), t=addDays(f,6); if(t<S.program.start) continue; out.push({w, from:f, to:t, ...perfScore(f,t)}); }

}

function drawChart(){
  const cv=$('#chart'); if(!cv || !cv.clientWidth) return;
  const P=S.profile, all=sortedWeights(); if(!all.length) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext('2d'); c.scale(dpr,dpr);
  const last=all[all.length-1].date;
  const start = chartRange ? addDays(last,-(chartRange-1)) : all[0].date;
  const pts=all.filter(x=>x.date>=start);
  const firstK = chartRange ? (pts[0]?.date||start) : start;
  const tr=trend();
  let end=last;
  if(tr&&tr.goalDate){ const cap=addDays(last, chartRange?Math.round(chartRange*0.6):120); end = tr.goalDate<cap?tr.goalDate:cap; }
  if(diffDays(firstK,end)<6) end=addDays(firstK,6);
  const ys=pts.map(p=>p.lb).concat([P.goal]); const ymin=Math.floor(Math.min(...ys)-2), ymax=Math.ceil(Math.max(...ys)+2);
  const L=36,R=10,Tp=10,B=24, pw=W-L-R, ph=H-Tp-B, span=diffDays(firstK,end)||1;
  const X=k=>L+diffDays(firstK,k)/span*pw, Y=v=>Tp+(ymax-v)/(ymax-ymin)*ph;
  c.font='11px -apple-system,Segoe UI,Roboto,sans-serif'; c.fillStyle='#5d6673'; c.strokeStyle='#232a34'; c.lineWidth=1;
  const step=(ymax-ymin)>24?5:2;
  for(let v=Math.ceil(ymin/step)*step; v<=ymax; v+=step){ c.beginPath(); c.moveTo(L,Y(v)); c.lineTo(W-R,Y(v)); c.stroke(); c.textAlign='right'; c.fillText(v,L-6,Y(v)+4); }
  c.textAlign='center';
  for(let i=0;i<=4;i++){ const kk=addDays(firstK,Math.round(span*i/4)); c.fillText(fmtDate(kk),Math.min(Math.max(X(kk),L+16),W-R-20),H-6); }
  c.setLineDash([5,5]); c.strokeStyle='#ff5a5f'; c.beginPath(); c.moveTo(L,Y(P.goal)); c.lineTo(W-R,Y(P.goal)); c.stroke();
  c.setLineDash([]); c.fillStyle='#ff5a5f'; c.textAlign='left'; c.fillText(`Goal ${P.goal}`,L+4,Y(P.goal)-5);
  if(tr&&tr.goalDate){ const yEnd=tr.lastFit+tr.slope*diffDays(last,end);
    c.setLineDash([3,4]); c.strokeStyle='#3ddc84'; c.lineWidth=2; c.beginPath(); c.moveTo(X(last),Y(tr.lastFit)); c.lineTo(X(end),Y(Math.max(yEnd,ymin))); c.stroke(); c.setLineDash([]); }
  c.fillStyle='#8b95a3'; pts.forEach(p=>{ c.beginPath(); c.arc(X(p.date),Y(p.lb),2.6,0,7); c.fill(); });
  const avgPts=pts.map(p=>[p.date,avgWeight(p.date)]);
  if(avgPts.length>1){
    const g=c.createLinearGradient(0,Tp,0,H-B); g.addColorStop(0,'rgba(212,255,58,.22)'); g.addColorStop(1,'rgba(212,255,58,0)');
    const path=()=>{ c.beginPath(); avgPts.forEach(([k,v],i)=>i?c.lineTo(X(k),Y(v)):c.moveTo(X(k),Y(v))); };
    path(); c.lineTo(X(avgPts[avgPts.length-1][0]),H-B); c.lineTo(X(avgPts[0][0]),H-B); c.closePath(); c.fillStyle=g; c.fill();
    path(); c.strokeStyle='#d4ff3a'; c.lineWidth=3; c.lineJoin='round'; c.stroke();
  }
  const lp=avgPts[avgPts.length-1]; c.fillStyle='#d4ff3a'; c.beginPath(); c.arc(X(lp[0]),Y(lp[1]),5,0,7); c.fill();
}

function parseHeightCm(h){
  if(h==null||h==='') return null; const s=String(h);
  let m=s.match(/(\d+)\s*'\s*(\d+(?:\.\d+)?)?/); if(m) return Math.round((+m[1]*12+(+m[2]||0))*2.54*10)/10;
  m=s.match(/(\d+(?:\.\d+)?)\s*cm/i); if(m) return +m[1];
  const n=num(s); return n==null?null:n>100?n:n>48?Math.round(n*2.54*10)/10:null;
}
function mealProfile(){ const st=S.meal.set; return {age:num(st.age)??num(S.profile.age), cm:num(st.cm)??parseHeightCm(S.profile.height), sex:st.sex==='f'?'f':'m'}; }

  const K=cur('kcal')??kcal, pro=r5(2.0*goalKg), proMin=r5(1.8*goalKg), proMax=r5(2.1*goalKg);
  const P=cur('pro')??pro, fatFloor=Math.round(0.3*lb), fat=Math.max(Math.round(K*0.275/9),fatFloor), F=cur('fat')??fat;
  const carb=Math.max(0,Math.round((K-4*P-9*F)/4));
  const v={kcal,pro,fat,carb,fib:30,water:64,na:2300,sug:25,train:100,rest:-250};
  const why={kcal:`Mifflin-St Jeor BMR ${fmtN(Math.round(bmr))} × activity ${act} = ${fmtN(Math.round(tdee))} maintenance, −${def}% deficit (never below 1,500).`,
    pro:`2.0 g/kg of goal weight (${r1(goalKg)} kg). Range 1.8–2.1 g/kg = ${proMin}–${proMax} g. Protein first after a sleeve.`,
    fat:`27.5% of calories, never below 0.3 g/lb (${fatFloor} g), for hormones and fullness.`,
    carb:`Whatever is left after protein & fat (${fmtN(K)} − ${P}×4 − ${F}×9) ÷ 4. More around workouts.`,
    fib:'25–35 g/day for fullness and regularity; increase slowly after surgery.',
    water:'64+ oz/day, sipped between meals (not 30 min before/after eating).',
    na:'Under 2,300 mg/day (Dietary Guidelines limit).',
    sug:'Added sugar under 25 g/day; sugar can trigger dumping-type symptoms after a sleeve.',
    train:'Mon–Fri lifting days: extra calories as carbs before and after your workout.',
    rest:'Sat–Sun rest days: fewer calories (taken from carbs).'};
  return {v, why, proMin, proMax, bmr, tdee, lb, kg, act, def, pr};
}
const TG_META={kcal:['Calories','kcal'],pro:['Protein','g'],fat:['Fat','g'],carb:['Carbs','g'],fib:['Fiber','g'],water:['Water','oz'],na:['Sodium (max)','mg'],sug:['Added sugar (max)','g'],train:['Training-day adjust','kcal'],rest:['Rest-day adjust','kcal']};
function tgVal(k){ const a=S.meal.tgt?.vals?.[k]; if(a!=null) return a; const s=suggestTargets(); return s.need?({kcal:(S.targets.calMin+S.targets.calMax)/2,pro:S.targets.proMin,fat:60,carb:150,fib:30,water:S.targets.water,na:2300,sug:25,train:100,rest:-250})[k]:s.v[k]; }

function acceptTarget(k,val){

  S.meal.tgt ||= {vals:{},basis:null,at:null};
  const v=num(val)??s.v[k]; S.meal.tgt.vals[k]=v; S.meal.tgt.basis=r1(s.lb); S.meal.tgt.at=today();
  if(k==='kcal'){ S.targets.calMin=Math.round(v-100); S.targets.calMax=Math.round(v+100); }
  if(k==='pro'){ S.targets.proMin=Math.min(s.proMin,Math.round(v)); S.targets.proMax=Math.max(s.proMax,Math.round(v)); }

}

/* ---- generator ---- */
function rng(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const kshare=(f,k,m)=>f.kcal>0?f[k]*m/f.kcal:0;
function eligible(r,f){
  if(r==='p') return ['lean','sea','egg','leg'].includes(f.g) && f.pro>=10 && kshare(f,'pro',4)>=0.35;
  if(r==='v') return f.g==='veg';
  if(r==='c') return (['carb','fruit'].includes(f.g) || (f.g==='leg'&&kshare(f,'pro',4)<0.35) || (f.g==='snack'&&kshare(f,'carb',4)>=0.5)) && f.carb>=8;
  if(r==='f') return f.g==='fat' && kshare(f,'fat',9)>=0.6;

function pool(r){
  const el=allFoods().list.filter(f=>eligible(r,f)&&!S.meal.avoid[f.id]), liked=el.filter(f=>S.meal.like[f.id]);
  return {list:liked.length?liked:el, fallback:!liked.length&&el.length>0};
}
function prefers(r,s,f){
  if(r==='p') return s===0?f.g==='egg':SNACK[s]?(f.g==='egg'||f.tags.includes('q')):f.g!=='egg';
  if(r==='c') return SNACK[s]?['fruit','snack'].includes(f.g):s===0?['carb','fruit'].includes(f.g):['carb','leg'].includes(f.g);
  if(r==='f') return SNACK[s]?f.prep!=='fat_measure':true;

const ROLES=s=>SNACK[s]?['p','c','f']:['p','v','c','f','k'];
function solveMeal(items,t,cap){
  const F=items.map(it=>food(it.id)||{kcal:0,pro:0,carb:0,fat:0,sg:0}), pg=(i,k)=>(F[i][k]||0)/100, ix=r=>items.findIndex(x=>x.r===r);
  const ip=ix('p'),iv=ix('v'),ic=ix('c'),iF=ix('f'),ik=ix('k'), g=items.map(it=>it.m?it.g:0), fixed=i=>items[i].m;
  if(ik>=0&&!fixed(ik)) g[ik]=Math.min(30,F[ik].sg||15);
  if(iv>=0&&!fixed(iv)) g[iv]=Math.min(100,Math.max(60,F[iv].sg||85));
  const cMax=ic>=0?Math.max(150,2.5*(F[ic].sg||60)):0, fMax=iF>=0?(pg(iF,'kcal')<4?Math.max(30,1.5*(F[iF].sg||50)):Math.max(30,3*(F[iF].sg||14))):0;
